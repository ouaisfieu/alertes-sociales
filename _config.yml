# ==============================================================================
# ALERTES SOCIALES BELGIQUE
# Configuration Jekyll pour GitHub Pages
# ==============================================================================

# Métadonnées du site
title: "Alertes Sociales Belgique"
description: "Surveillance citoyenne des droits sociaux en Belgique. Documentation du démantèlement des protections sociales, coalition Arizona, moratoire Éducation Permanente FWB."
tagline: "Veille citoyenne sur les droits sociaux"
url: "https://alertes-sociales.be"
baseurl: ""
repository: "collectif-alertes-sociales/alertes-sociales.be"

# Auteur / Organisation
author:
  name: "Collectif Alertes Sociales"
  email: "contact@alertes-sociales.be"
  twitter: "@AlertesSociales"

# Paramètres de publication
lang: "fr-BE"
timezone: "Europe/Brussels"
encoding: "UTF-8"

# Permalinks
permalink: /articles/:title/

# Collections
collections:
  articles:
    output: true
    permalink: /articles/:name/

# Defaults
defaults:
  - scope:
      path: ""
      type: "pages"
    values:
      layout: "default"
  - scope:
      path: ""
      type: "articles"
    values:
      layout: "article"
      author: "Collectif Alertes Sociales"

# Build settings
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 2..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo

# Plugins GitHub Pages
plugins:
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-redirect-from

# Jekyll Feed
feed:
  path: feeds/rss.xml

# Jekyll SEO Tag
twitter:
  username: AlertesSociales
  card: summary_large_image

social:
  name: Collectif Alertes Sociales
  links:
    - https://twitter.com/AlertesSociales
    - https://github.com/collectif-alertes-sociales

# Open Graph
logo: /assets/img/logo-512.png

# Exclude from build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
  - .sass-cache
  - .jekyll-cache
  - README.md
  - CONTRIBUTING.md
  - LICENSE
  - "*.gemspec"
  - drafts/
  - private/

# Include in build
include:
  - _pages
  - .well-known
  - robots.txt
  - sitemap.xml
  - sitemap-news.xml

